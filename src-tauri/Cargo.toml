[package]
name = "kugou-music-player"
version = "0.5.2"
description = "KuGou Music Player with Tauri v2"
authors = ["wnjie"]
edition = "2021"

[lib]
name = "kugou_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 桌面端托盘 / 菜单栏图标，主界面隐藏后靠它叫回来并做播放控制
# image-png: 运行时用 Image::from_bytes 解码托盘图标（macOS 模板图 / 3 柱小图）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# unsafe-headers：酷狗接口依赖 Cookie / Referer / Host 自带头，plugin-http 默认会把它们剔除（H2）
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri::generate_context! 展开后会直接引用 crate 根的 serde_json，不能删。
serde_json = "1"

# 桌面端独占插件（移动端不编译，只影响非 Android / iOS 目标）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# 体积优化：官方推荐的 Tauri release 配置
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
