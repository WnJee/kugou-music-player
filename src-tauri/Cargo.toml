[package]
name = "kugou-music-player"
version = "0.3.1"
description = "KuGou Music Player with Tauri v2"
authors = ["wnjie"]
edition = "2021"

[lib]
name = "kugou_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
