name: Release

# 推送 v* 标签时自动触发，例如: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 先创建 GitHub Release，供各平台并行上传产物
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
          gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --title "KuGouPlayer ${{ github.ref_name }}" --generate-notes

  # 桌面端: macOS (universal) + Windows
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''
    needs: create-release
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新签名（tauri-action 检测到后自动签名并生成 latest.json）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KuGouPlayer ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 安卓: Release 签名 APK（arm64-v8a 覆盖麒麟980等主流64位芯片 + armv7 兼容老设备）
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android NDK env
        run: echo "NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | head -1)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      # 从 secrets 还原正式签名密钥并生成 keystore.properties（供 build.gradle.kts 读取）
      - name: Restore release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            cd src-tauri/gen/android
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets，安卓包回退为 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK (release signed)
        if: steps.keystore.outputs.signed == 'true'
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Build Android APK (debug fallback)
        if: steps.keystore.outputs.signed != 'true'
        run: npx tauri android build --apk --debug --target aarch64 --target armv7

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk
          # 自动定位 APK，兼容 universal 合并与分 ABI 两种输出布局，
          # 以及 release 输出的多一层 buildType 目录（apk/<abi>/release/*.apk）
          shopt -s nullglob
          found=0
          for f in $(find . -name '*.apk'); do
            abi=$(basename "$(dirname "$f")")
            case "$abi" in
              release|debug) abi=$(basename "$(dirname "$(dirname "$f")")") ;;
            esac
            case "$abi" in
              universal) out="KuGouPlayer-${{ github.ref_name }}-android-universal.apk" ;;
              aarch64)   out="KuGouPlayer-${{ github.ref_name }}-android-arm64.apk" ;;
              armv7)     out="KuGouPlayer-${{ github.ref_name }}-android-armv7.apk" ;;
              x86)       out="KuGouPlayer-${{ github.ref_name }}-android-x86.apk" ;;
              x86_64)    out="KuGouPlayer-${{ github.ref_name }}-android-x86_64.apk" ;;
              *)         out="KuGouPlayer-${{ github.ref_name }}-android-${abi}.apk" ;;
            esac
            cp "$f" "/tmp/$out"
            found=1
          done
          if [ "$found" != 1 ]; then
            echo "::error::未找到任何 APK"; ls -R .; exit 1
          fi
          gh release upload "${{ github.ref_name }}" /tmp/KuGouPlayer-*.apk --clobber --repo "$GITHUB_REPOSITORY"
